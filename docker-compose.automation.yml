services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: mana-community-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_METRICS=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./automation/workflows:/automation/workflows:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  n8n_data:
    name: mana_community_n8n_data
