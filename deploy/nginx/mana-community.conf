# ─────────────────────────────────────────────────────────────────────────────
# Nginx server block for the PRODUCTION environment.
#
# Serves the React SPA deployed by .github/workflows/deploy-main.yml to
# /var/www/mana-community, and proxies API + WebSocket traffic to the
# Spring Boot backend running on the same Lightsail host (port 8080).
#
# Install on the server:
#   sudo cp mana-community.conf /etc/nginx/sites-available/mana-community
#   sudo ln -s /etc/nginx/sites-available/mana-community /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/www/mana-community
#   sudo chown -R www-data:www-data /var/www/mana-community
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add TLS (required for iPhone / Safari):
#   sudo certbot --nginx -d manacommunityhub.com -d www.manacommunityhub.com
#
# EDIT BEFORE USE:
#   - server_name: confirm your production hostname(s).
#   - backend port: 8080 is the default Spring Boot port.
# ─────────────────────────────────────────────────────────────────────────────

# Only reflect back origins that belong to this site.
# An unrecognised origin gets an empty string → no CORS header → browser blocks.
map $http_origin $cors_origin {
    default                                      "";
    "~^https?://manacommunityhub\.com$"          $http_origin;
    "~^https?://www\.manacommunityhub\.com$"     $http_origin;
    "~^https?://localhost(:[0-9]+)?$"            $http_origin;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name manacommunityhub.com www.manacommunityhub.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (TLS block added/managed by Certbot) ────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name manacommunityhub.com www.manacommunityhub.com;

    # Certbot fills in the ssl_certificate / ssl_certificate_key lines:
    # ssl_certificate     /etc/letsencrypt/live/manacommunityhub.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/manacommunityhub.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/mana-community;
    index index.html;

    client_max_body_size 25m;

    # ── Static assets (content-hashed by Vite → safe to cache forever) ────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── REST API → Spring Boot ─────────────────────────────────────────────────
    location /api/ {
        # Answer CORS preflight (OPTIONS) immediately — never forward to backend.
        # Safari on iPhone sends a preflight for every POST/PUT/PATCH/DELETE that
        # carries a custom header (Authorization, Content-Type: application/json,
        # X-Correlation-Id). If nginx or the backend doesn't reply with the right
        # Access-Control-Allow-* headers the browser silently aborts the request
        # and the app shows a CORS or network error on the login screen.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Correlation-Id" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age           "86400" always;
            add_header Content-Length                   0;
            add_header Content-Type                     "text/plain";
            return 204;
        }

        # Add CORS headers to all proxied responses (including 4xx/5xx).
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── STOMP / WebSocket handshake ────────────────────────────────────────────
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # ── SPA fallback ───────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
