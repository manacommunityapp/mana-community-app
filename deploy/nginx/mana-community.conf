# ─────────────────────────────────────────────────────────────────────────────
# Nginx server block for the PRODUCTION environment.
#
# Serves the React SPA deployed by .github/workflows/deploy-main.yml to
# /var/www/mana-community, and proxies API + WebSocket traffic to the
# Spring Boot backend running on the same Lightsail host (port 8080).
#
# Install on the server:
#   sudo cp deploy/nginx/mana-community.conf /etc/nginx/sites-available/mana-community
#   sudo ln -s /etc/nginx/sites-available/mana-community /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/www/mana-community
#   sudo chown -R www-data:www-data /var/www/mana-community
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add TLS (required for iPhone / Safari):
#   sudo certbot --nginx -d manacommunityhub.com -d www.manacommunityhub.com
# ─────────────────────────────────────────────────────────────────────────────

# Only reflect back origins that belong to this site.
# An unrecognised origin gets an empty string → no CORS header → browser blocks.
map $http_origin $cors_origin {
    default                                      "";
    "~^https?://manacommunityhub\.com$"          $http_origin;
    "~^https?://www\.manacommunityhub\.com$"     $http_origin;
    "~^https?://dev\.manacommunityhub\.com$"     $http_origin;
    "~^https?://localhost(:[0-9]+)?$"            $http_origin;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name manacommunityhub.com www.manacommunityhub.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (TLS block added/managed by Certbot) ────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name manacommunityhub.com www.manacommunityhub.com;

    # Certbot fills in the ssl_certificate / ssl_certificate_key lines:
    # ssl_certificate     /etc/letsencrypt/live/manacommunityhub.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/manacommunityhub.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/mana-community;
    index index.html;

    client_max_body_size 25m;

    # ── Security Headers (OWASP ASVS 14.4.3 compliant) ────────────────────────
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: wss: ws:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "0" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Static assets (content-hashed by Vite → safe to cache forever) ────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── REST API → Spring Boot ─────────────────────────────────────────────────
    location /api/ {
        # Answer CORS preflight (OPTIONS) immediately — never forward to backend.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Correlation-Id" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age           "86400" always;
            add_header Content-Length                   0;
            add_header Content-Type                     "text/plain";
            return 204;
        }

        # Add CORS headers to all proxied responses (including 4xx/5xx).
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── STOMP / WebSocket handshake ────────────────────────────────────────────
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # ── SPA fallback: React Router routes resolve to index.html ───────────────
    # NEVER cache index.html so the browser always loads the latest asset bundle hashes.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;

        # Re-apply security headers (nginx does not inherit server-level add_header if defined inside location)
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: wss: ws:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header X-XSS-Protection          "0" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # Explicit direct match for /index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;

        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: wss: ws:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header X-XSS-Protection          "0" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
