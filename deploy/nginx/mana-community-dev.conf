# ─────────────────────────────────────────────────────────────────────────────
# Nginx server block for the DEVELOP environment.
#
# Serves the React SPA deployed by .github/workflows/deploy-develop.yml to
# /var/www/mana-community-dev, and proxies API + WebSocket traffic to the
# backend running on the same Lightsail host.
#
# Install on the server:
#   sudo cp mana-community-dev.conf /etc/nginx/sites-available/mana-community-dev
#   sudo ln -s /etc/nginx/sites-available/mana-community-dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add TLS (see deploy/nginx/README-dev-nginx.md).
#
# EDIT BEFORE USE:
#   - server_name: set to your real dev hostname (DNS A record -> Lightsail IP).
#   - backend port: 8080 assumes develop shares the prod backend. If you run a
#     SEPARATE dev backend, change every :8080 below to that port (e.g. 8081).
# ─────────────────────────────────────────────────────────────────────────────

# Map the request Origin to an allowed-origin value.
# Only origins in this list get reflected back; everything else gets an empty
# string so the browser sees no CORS header (and blocks the request).
map $http_origin $cors_origin {
    default                              "";
    "~^https?://localhost(:[0-9]+)?$"   $http_origin;
    "~^https?://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
    "~^https?://dev\.manacommunityhub\.com$" $http_origin;
    "~^https?://manacommunityhub\.com$"  $http_origin;
    "~^https?://www\.manacommunityhub\.com$" $http_origin;
}

server {
    listen 80;
    listen [::]:80;

    server_name dev.manacommunity.example;   # <-- CHANGE to your dev hostname

    root /var/www/mana-community-dev;
    index index.html;

    # Reasonable upload ceiling (bulk uploads, images, etc.)
    client_max_body_size 25m;

    # ── Static assets: long cache (filenames are content-hashed by Vite) ──────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── REST API -> Spring Boot (path is NOT rewritten; backend serves /api) ──
    location /api/ {
        # Handle CORS preflight (OPTIONS) without hitting the backend.
        # Safari on iOS sends a preflight for every non-simple cross-origin
        # request (e.g. POST with Content-Type: application/json).
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Correlation-Id" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age           "86400" always;
            add_header Content-Length                   0;
            add_header Content-Type                     "text/plain";
            return 204;
        }

        # Forward CORS headers on all other responses (including error codes).
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── STOMP / WebSocket handshake -> Spring's /ws (needs upgrade headers) ───
    location /ws {
        # WebSocket upgrade — CORS not enforced here; connections are same-origin.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # keep long-lived sockets open
    }

    # ── SPA fallback: React Router routes resolve to index.html ───────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # gzip for text assets (safe defaults; ignored if already enabled globally)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
