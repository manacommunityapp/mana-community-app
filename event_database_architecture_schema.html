  <script id="raw-markdown" type="text/plain"># 🗄️ Mana Community App — Event Module Database Architecture & Schema Blueprint

> **Database System**: PostgreSQL 15+ / RDS  
> **Schema Name**: `manacommunity`  
> **ORM Layer**: Spring Data JPA / Hibernate 6.x  
> **Migrations**: Flyway (`V1__baseline` through `V58__add_payment_and_contact_details`)  
> **Backend Service**: `mana-community-service`  
> **Frontend App**: `mana-community-app` (React 19 / Vite / TailwindCSS)

#### 1.1 `community_event`
* **Entity**: [`CommunityEvent.java`](file:///d:/Application/applications/mana%20community/mana-community-service/src/main/java/com/manacommunity/api/events/entity/CommunityEvent.java)
* **Description**: Central event records supporting multi-day festivals, ticketing, online/manual payment configuration, QR scanners, and committee contacts.

| Column | Type | Constraints | Description |
| :--- | :--- | :--- | :--- |
| `id` | `BIGSERIAL` | PRIMARY KEY | Unique event identifier |
| `title` | `VARCHAR(255)` | NOT NULL | Event / Festival title (e.g. *Ganesh Chaturthi Utsav 2026*) |
| `description` | `TEXT` | NULL | Full description and schedule details |
| `type` / `category` | `VARCHAR(50)` | DEFAULT `'festival'` | Type: `festival`, `pooja`, `cultural`, `sports`, `general` |
| `start_date` / `end_date` | `DATE` | NOT NULL | Multi-day festival start & end dates |
| `start_time` / `end_time` | `TIME` | NULL | Daily operating hours |
| `location` / `venue` | `VARCHAR(255)` | NULL | Primary venue/hall name |
| `venue_id` | `BIGINT` | FK -> `event_venues(id)` | Linked structured venue |
| `capacity` / `max_attendees` | `INT` | NULL | Total capacity / registrant limit |
| `price_type` | `VARCHAR(20)` | DEFAULT `'FREE'` | `FREE`, `PAID`, `DONATION` |
| `price` | `NUMERIC(10,2)` | NULL | Base pass fee (if single tier) |
| `payment_modes` | `VARCHAR(255)` | NULL | Comma-delimited: `UPI,Card,NetBanking,Cash` |
| `upi_id` | `VARCHAR(100)` | NULL | Event VPA (`temple.trust@icici`) |
| `scanner_url` | `VARCHAR(1000)` | NULL | S3 URL or direct link to payment QR code scanner image |
| `notes` | `TEXT` | NULL | Devotee guidelines, dress code, parking & entry instructions |
| `contacts_json` | `TEXT` | NULL | JSON array of committee coordinators `[{name, phone, role}]` |
| `payment_instructions` | `TEXT` | NULL | Instructions for UPI scan & UTR confirmation |
| `status` | `VARCHAR(30)` | DEFAULT `'PUBLISHED'` | `DRAFT`, `PUBLISHED`, `COMPLETED`, `CANCELLED` |
| `created_by` | `BIGINT` | FK -> `app_user(id)` | Creator / Organizer user ID |
| `community_id` | `BIGINT` | FK -> `community(id)` | Tenant community ID |

## 🔒 Security & Multi-Tenancy Design

1. **Community Isolation**: All tables contain `community_id` foreign keys indexed for sub-millisecond multi-tenant query filtering.
2. **User Authentication**: Binds `user_id` to `app_user` with `@AuthenticationPrincipal` validation in all controllers.
3. **Data Integrity**: Uses `@PrePersist` and `@PreUpdate` JPA entity hooks to manage audit timestamps (`created_at`, `updated_at`).
4. **Flyway Migration Strategy**: Schema changes are revision-controlled under `src/main/resources/db/migration/` (`V1` to `V58`).
